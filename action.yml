name: 'ShaderSmith Resource Pack Shader Contract Check'
description: 'Validate or migrate Minecraft resource pack GLSL shaders and post effects against vanilla shader contracts (1.21.4 through 26.3) with SARIF output.'
author: 'SalyyS1'

branding:
  icon: 'eye'
  color: 'purple'

inputs:
  pack:
    description: 'Path to the resource pack directory or .zip archive'
    required: true
  mc:
    description: 'Target Minecraft version (e.g. 26.3-pre-1). Mutually exclusive with mc-range.'
    required: false
    default: ''
  mc-range:
    description: 'Minecraft version range (e.g. 1.21.6..26.3-pre-1). Mutually exclusive with mc.'
    required: false
    default: ''
  sarif:
    description: 'Optional output path for SARIF v2.1.0 report (for GitHub Code Scanning)'
    required: false
    default: ''
  json:
    description: 'Optional output path for JSON findings report'
    required: false
    default: ''
  version:
    description: 'ShaderSmith release tag to download'
    required: false
    default: 'v0.2.0'

runs:
  using: 'composite'
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Download ShaderSmith CLI
      shell: bash
      env:
        SHADERSMITH_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        VERSION_NUM="${SHADERSMITH_VERSION#v}"
        JAR_URL="https://github.com/SalyyS1/shadersmith/releases/download/${SHADERSMITH_VERSION}/shadersmith-${VERSION_NUM}.jar"
        mkdir -p "${RUNNER_TEMP}/shadersmith"
        curl -fsSL "${JAR_URL}" -o "${RUNNER_TEMP}/shadersmith/shadersmith.jar"

    - name: Run ShaderSmith Check
      shell: bash
      env:
        INPUT_PACK: ${{ inputs.pack }}
        INPUT_MC: ${{ inputs.mc }}
        INPUT_MC_RANGE: ${{ inputs.mc-range }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_JSON: ${{ inputs.json }}
      run: |
        set -euo pipefail
        ARGS=("check" "${INPUT_PACK}")
        if [ -n "${INPUT_MC}" ]; then
          ARGS+=("--mc" "${INPUT_MC}")
        elif [ -n "${INPUT_MC_RANGE}" ]; then
          ARGS+=("--mc-range" "${INPUT_MC_RANGE}")
        else
          echo "::error::Either 'mc' or 'mc-range' input must be set."
          exit 2
        fi
        if [ -n "${INPUT_SARIF}" ]; then
          ARGS+=("--sarif" "${INPUT_SARIF}")
        fi
        if [ -n "${INPUT_JSON}" ]; then
          java -jar "${RUNNER_TEMP}/shadersmith/shadersmith.jar" "${ARGS[@]}" --json > "${INPUT_JSON}"
        else
          java -jar "${RUNNER_TEMP}/shadersmith/shadersmith.jar" "${ARGS[@]}"
        fi
